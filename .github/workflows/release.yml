# A release, from a tag and nothing else.
#
#   git tag -a v1.3.0 -m "Apricot Studio 1.3.0" -m "<what changed>"
#   git push origin v1.3.0
#
# Everything is built here from a clean checkout of the tag: the Windows zip,
# with ffmpeg beside the .exe, and the Flatpak. The release
# notes are the tag's own message, followed by a table of what to download, so
# writing the tag is writing the release.
#
# The version in Cargo.toml must match the tag. tests/units.rs already holds
# the metainfo to the same version, so all three agree or nothing ships.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: check the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$tag" != "$cargo" ]; then
            echo "::error::tag $GITHUB_REF_NAME but Cargo.toml says $cargo"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  windows:
    name: windows
    needs: version
    runs-on: windows-latest
    env:
      NAME: apricot-studio-${{ needs.version.outputs.version }}-windows-x64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Test what runs without ffmpeg
        run: cargo test --test units --test commands --test theme

      # gyan.dev's "essentials" build carries ffmpeg.exe and ffprobe.exe with
      # libx264 and libx265, which is what a screen recorder's output needs.
      # The app finds them beside its own .exe before it looks at PATH.
      - name: Lay out the folder, with ffmpeg beside the app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "out\$env:NAME" | Out-Null
          Copy-Item target\release\apricot-studio.exe, LICENSE, README.md "out\$env:NAME"

          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          foreach ($name in "ffmpeg.exe", "ffprobe.exe") {
            $found = Get-ChildItem ffmpeg -Filter $name -Recurse | Select-Object -First 1
            if (-not $found) { throw "$name was not in the downloaded archive" }
            Copy-Item $found.FullName "out\$env:NAME"
          }

          Compress-Archive -Path "out\$env:NAME" -DestinationPath "out\$env:NAME.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*.zip

  flatpak:
    name: flatpak
    needs: version
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      # The first run compiles x264, x265 and ffmpeg, which is most of an hour.
      # The cache key follows the manifest, so later releases reuse them until
      # one of those three changes.
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/io.github.raulblideran.ApricotStudio.yaml
          bundle: apricot-studio-${{ needs.version.outputs.version }}.flatpak
          cache-key: flatpak-builder-${{ hashFiles('packaging/io.github.raulblideran.ApricotStudio.yaml') }}
          upload-artifact: false

      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: apricot-studio-${{ needs.version.outputs.version }}.flatpak

  publish:
    name: publish the release
    needs: [version, windows, flatpak]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # actions/checkout fetches a tag as a bare ref, dropping the message, so
      # fetch it again to read what it says.
      - name: Write the notes from the tag
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME" > notes.md
          cat >> notes.md <<EOF

          ## Downloads

          | File | For |
          |---|---|
          | \`apricot-studio-$VERSION.flatpak\` | **Linux.** \`flatpak install --user apricot-studio-$VERSION.flatpak\`. Carries its own ffmpeg with libx264 and libx265. |
          | \`apricot-studio-$VERSION-windows-x64.zip\` | **Windows 10/11.** Unzip and run \`apricot-studio.exe\`. ffmpeg and ffprobe are included beside it. |
          | \`SHA256SUMS\` | Checksums for all of the above. |

          The Windows build is not signed, so SmartScreen asks before the first run ("More info" → "Run anyway").
          EOF

      - name: Publish
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" * \
            --title "Apricot Studio $VERSION" --notes-file ../notes.md
