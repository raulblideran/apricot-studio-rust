# The suite, on every push, and a build on each platform the app claims to run
# on.
#
# The Linux job runs the whole thing including the real encodes: the tests that
# catch the defects this project actually shipped are the ones that invoke
# ffmpeg, so a CI run that skipped them would be reassurance without cover.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  suite:
    name: tests (linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg, the window libraries and the packaging validators
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libasound2-dev libudev-dev \
            libxkbcommon-x11-0 libgl1 libegl1 \
            desktop-file-utils appstream

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --check

      - name: Lints
        run: cargo clippy --all-targets -- -D warnings

      - name: Run the suite
        # No display on a runner, and none needed: the window tests drive real
        # frames through egui_kittest without opening one.
        run: ./run-tests.sh

      - name: Validate the desktop entry
        run: desktop-file-validate packaging/io.github.raulblideran.ApricotStudio.desktop

      - name: Validate the metainfo
        # --no-net because the default run fetches every <url> in the file to
        # see whether it resolves. That turns a GitHub hiccup into a red build
        # and tests the internet rather than the document.
        run: appstreamcli validate --no-net packaging/io.github.raulblideran.ApricotStudio.metainfo.xml

  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      # The parts that do not need ffmpeg or a window run everywhere, and they
      # are where the export rules and the theme measurements live.
      - name: Test what runs without ffmpeg
        run: cargo test --test units --test commands --test theme
