# Flatpak manifest for Apricot Studio.
#
# Two things have to be built here, and both for the same reason as before the
# rewrite: the runtime's ffmpeg is built without libx264 and libx265, because
# they are GPL, and H.264 is the whole point of this app -- screen recorders
# produce it. So x264 and x265 are built from source and ffmpeg is rebuilt
# against them. That is what makes this bundle GPL-3.0-or-later rather than
# something more permissive.
#
# Everything else the encoder needs -- opus, vpx, SVT-AV1, VA-API -- is already
# in the runtime, so ffmpeg links those rather than rebuilding them.
#
# What is *not* here any more: Python, PyQt6 and Qt. The app is one static
# binary against the freedesktop runtime, so the bundle is smaller and there is
# no plugin path to get wrong.
app-id: io.github.raulblideran.ApricotStudio
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
# 25.08 rather than 24.08 for one reason: the rust extension there is 1.89,
# and egui needs 1.95. The 25.08 extension is 1.98.
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: apricot-studio

finish-args:
  # Wayland first, X11 only as a fallback for non-Wayland sessions.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri                 # the window is drawn on the GPU; also VA-API
  - --socket=pulseaudio          # preview playback
  # Videos are the point of the app; the file chooser portal cannot cover
  # "export next to the source", which needs to write where the source lives.
  - --filesystem=xdg-videos
  - --filesystem=xdg-pictures
  - --filesystem=xdg-download
  # The delete-original option hands files to the desktop wastebasket, and
  # "Show in folder" opens the file manager, both over the session bus.
  - --talk-name=org.freedesktop.FileManager1
  # The app writes the freedesktop trash entry itself rather than going through
  # the Trash portal, which some desktops advertise without implementing. That
  # needs the real wastebasket -- not the app's private XDG_DATA_HOME, which no
  # file manager would ever look in. Every location the app can reach is on the
  # same filesystem as this, so the move stays a rename.
  - --filesystem=~/.local/share/Trash:create

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/apricot-studio/cargo

cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/*.a
  - /lib/*.la
  - /share/man
  - /share/doc
  - '*.a'
  - '*.la'

modules:
  # ---- GPL encoders the runtime deliberately omits ----------------------
  - name: x264
    config-opts:
      - --enable-shared
      - --enable-pic
      - --disable-cli
    sources:
      - type: git
        url: https://code.videolan.org/videolan/x264.git
        commit: 31e19f92f00c7003fa115047ce50978bc98c3a0d

  - name: x265
    buildsystem: cmake-ninja
    subdir: source
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DENABLE_CLI=OFF
      - -DENABLE_SHARED=ON
    sources:
      - type: archive
        url: https://bitbucket.org/multicoreware/x265_git/downloads/x265_4.1.tar.gz
        sha256: a31699c6a89806b74b0151e5e6a7df65de4b49050482fe5ebf8a4379d7af8f29
      # x265 asks for CMP0025 and CMP0054 in OLD behaviour, which CMake 4 --
      # what the Sdk ships -- refuses outright rather than warning about. Both
      # only affect AppleClang detection and if() quoting, neither of which
      # matters for this build, so NEW is the correct resolution.
      - type: shell
        commands:
          - sed -i 's/cmake_policy(SET CMP0025 OLD)/cmake_policy(SET CMP0025 NEW)/;
              s/cmake_policy(SET CMP0054 OLD)/cmake_policy(SET CMP0054 NEW)/;
              s/cmake_minimum_required (VERSION 2.8.8)/cmake_minimum_required (VERSION 3.5)/'
              source/CMakeLists.txt

  # ---- ffmpeg, rebuilt so the encoders above are actually reachable -----
  # /app/bin comes before /usr/bin, so this shadows the runtime's ffmpeg -- and
  # it is the binary the app looks for, since everything it does is a call to
  # ffmpeg or ffprobe.
  - name: ffmpeg
    config-opts:
      - --enable-shared
      - --disable-static
      - --enable-gpl
      - --disable-doc
      - --disable-debug
      - --enable-libx264
      - --enable-libx265
      - --enable-libopus
      - --enable-libvpx
      - --enable-libsvtav1
      - --enable-vaapi
      - --enable-libdrm
      # NVENC off, deliberately. The 25.08 runtime carries nv-codec-headers 13,
      # which renamed a field ffmpeg 8.0 still writes to, so the build fails on
      # libavcodec/nvenc.c. Nothing here encodes with NVENC -- H.264 and H.265
      # go to x264/x265 above, and AV1 to VA-API -- so the fix is to not build
      # a codec this app would never reach for.
      - --disable-ffnvcodec
      - --disable-htmlpages
      - --disable-manpages
    sources:
      # 8.0 rather than 7.x: SVT-AV1 3.x changed svt_av1_enc_init_handle from
      # three arguments to two, and the runtime ships SVT-AV1 3, so ffmpeg 7
      # simply will not compile against it.
      - type: archive
        url: https://ffmpeg.org/releases/ffmpeg-8.0.tar.xz
        sha256: b2751fccb6cc4c77708113cd78b561059b6fa904b24162fa0be2d60273d27b8e

  # ---- the application -------------------------------------------------
  - name: apricot-studio
    buildsystem: simple
    # Cargo needs the crates it depends on, and a flatpak build has no network.
    # `--share=network` is the honest answer for a local build and is what the
    # README tells you to use. Flathub does not allow it: generate
    # cargo-sources.json with packaging/flatpak/generate-cargo-sources.sh, add
    # it to `sources` below, and drop this line.
    build-options:
      build-args:
        - --share=network
    build-commands:
      - cargo build --release
      - install -Dm755 target/release/apricot-studio -t /app/bin/
      - install -Dm644 packaging/io.github.raulblideran.ApricotStudio.svg
        -t /app/share/icons/hicolor/scalable/apps/
      - install -Dm644 packaging/io.github.raulblideran.ApricotStudio.desktop
        -t /app/share/applications/
      - install -Dm644 packaging/io.github.raulblideran.ApricotStudio.metainfo.xml
        -t /app/share/metainfo/
    sources:
      - type: dir
        path: ..
